- name: variables from files
  hosts: localhost
  vars_prompt:
  - name: USERNAME
    prompt: "Please enter your username"
    private: false
  - name: PASSWORD
    prompt: "Please enter your password"
    private: true
  tasks:
  - name: print information
    ansible.builtin.debug:
      msg: "Hello, Username: {{ USERNAME }}. Password is: {{ PASSWORD }}" 